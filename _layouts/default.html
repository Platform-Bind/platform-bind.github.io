<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="12" y="12" width="17" height="17" rx="4" fill="currentColor" opacity="0.6"/>
        </svg>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        {% for item in site.nav %}
          <a class="button{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main id="content" class="container site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-buttons">
        {% for item in site.footer_links %}
          <a class="button button-outline" href="{{ item.url }}">{{ item.title }}</a>
        {% endfor %}
        <a class="button button-outline" href="#top">Back to top</a>
      </div>
      <p class="footer-note">© {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
